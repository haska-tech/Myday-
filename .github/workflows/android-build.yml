name: Android build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure and verify permanent development signing key
        if: github.ref == 'refs/heads/development'
        env:
          MYDAY_KEYSTORE_BASE64: ${{ secrets.MYDAY_KEYSTORE_BASE64 }}
          MYDAY_KEYSTORE_PASSWORD: ${{ secrets.MYDAY_KEYSTORE_PASSWORD }}
          MYDAY_KEY_ALIAS: ${{ secrets.MYDAY_KEY_ALIAS }}
          MYDAY_KEY_PASSWORD: ${{ secrets.MYDAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MYDAY_KEYSTORE_BASE64" || (echo "Missing MYDAY_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$MYDAY_KEYSTORE_PASSWORD" || (echo "Missing MYDAY_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$MYDAY_KEY_ALIAS" || (echo "Missing MYDAY_KEY_ALIAS repository secret" && exit 1)
          test -n "$MYDAY_KEY_PASSWORD" || (echo "Missing MYDAY_KEY_PASSWORD repository secret" && exit 1)
          signing_dir="$RUNNER_TEMP/myday-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$MYDAY_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/myday-debug.keystore"
          test -s "$signing_dir/myday-debug.keystore"
          # Pin the permanent #101 baseline certificate.
          expected="19e1a377b55b7fc12f0ee50d042d24ceea511a9c169ff87bb443b697456ac8d6"
          actual="$(keytool -list -v -keystore "$signing_dir/myday-debug.keystore" -storepass "$MYDAY_KEYSTORE_PASSWORD" -alias "$MYDAY_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo "STOP: signing certificate does not match permanent #101 baseline"; exit 1; }
          echo "Verified permanent signing certificate matches permanent #101 baseline."
          echo "MYDAY_KEYSTORE_PATH=$signing_dir/myday-debug.keystore" >> "$GITHUB_ENV"
          echo "MYDAY_KEYSTORE_PASSWORD=$MYDAY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MYDAY_KEY_ALIAS=$MYDAY_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MYDAY_KEY_PASSWORD=$MYDAY_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Run unit tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature, application ID and version
        if: github.ref == 'refs/heads/development'
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          expected="19e1a377b55b7fc12f0ee50d042d24ceea511a9c169ff87bb443b697456ac8d6"
          actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$RUNNER_TEMP/apk-certificate.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo "STOP: built APK certificate mismatch"; exit 1; }
          badging="$("$aapt" dump badging "$apk")"
          package="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test "$package" = "com.haskatech.myday" || { echo "STOP: unexpected application ID: $package"; exit 1; }
          test "$version_code" -gt 12 || { echo "STOP: versionCode must increase beyond M4 baseline versionCode 12"; exit 1; }
          echo "Verified APK certificate, application ID=$package, versionCode=$version_code."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
